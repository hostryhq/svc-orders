name: ci

on:
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]

# Cancel superseded runs to save Actions minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    uses: hostryhq/.github/.github/workflows/go-ci.yml@main
    # This repo imports private hostryhq modules (go-common, go-auth) and api-specs.
    secrets:
      private-modules-token: ${{ secrets.GO_PRIVATE_MODULES_TOKEN }}

  gitleaks:
    uses: hostryhq/.github/.github/workflows/gitleaks.yml@main

  # Single status check for the ruleset: "ci / required".
  required:
    if: always()
    needs: [go, gitleaks]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: All required jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
